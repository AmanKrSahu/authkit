name: CI/CD Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v4

      - name: Get pnpm Store Directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Codebase
        run: pnpm lint

      - name: Check TypeScript Compilation
        run: pnpm type-check

      - name: Run In-Memory Test Suite (with Coverage)
        env:
          NODE_ENV: test
          JWT_SECRET: 'test-jwt-secret-key-must-be-32-chars-long'
          JWT_REFRESH_SECRET: 'test-jwt-refresh-secret-must-be-32-chars-long'
          JWT_RESET_SECRET: 'test-jwt-reset-secret-must-be-32-chars-long'
          JWT_MFA_LOGIN_SECRET: 'test-jwt-mfa-secret-must-be-32-chars-long'
          AUTHENTICATOR_APP_SECRET: 'test-authenticator-app-secret-32-bytes'
          OIDC_COOKIE_KEYS: 'test-cookie-key-1,test-cookie-key-2'
          OIDC_JWKS: '{"keys":[{"kty":"oct","k":"test-oidc-secret-key-32-chars"}]}'
        run: pnpm test
